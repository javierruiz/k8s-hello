apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hello-apache
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/javierruiz/k8s-hello.git
    targetRevision: main
    path: chart/hello-apache

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: hello

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true